# CI: build and collect artifacts, then upload them
# Key points:
# - OUT_DIR is set at the job level and referenced via ${{ env.OUT_DIR }} everywhere, including the upload-artifact step.
# - Robust artifact collection using find -print0 | xargs -0 cp --parents
# - Debug output to verify captured files before upload
on:
  push:
    branches: [ main ]
  workflow_dispatch:

name: Build and upload artifacts

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      OUT_DIR: build-artifacts

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java (for Gradle builds)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Rust toolchain (optional)
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal

      - name: Prepare runner (install packages)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang lld \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu pkg-config git curl unzip rsync

      - name: Create OUT_DIR
        run: mkdir -p "${{ env.OUT_DIR }}"

      - name: Build and collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          echo "OUT_DIR='${{ env.OUT_DIR }}'"
          echo "Workspace: $GITHUB_WORKSPACE"
          # Gradle / Android library and APK
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            echo "Running gradle assemble"
            ./gradlew assembleRelease assembleDebug --no-daemon || true
            # find and copy artifacts (.so, .apk)
            find . -type f \( -name "*.so" -o -name "*.apk" -o -name "ksud*" \) -print0 \
              | xargs -0 -r -I{} cp --parents "{}" "${{ env.OUT_DIR }}/"
          fi

          # Repository-provided scripts
          for s in build-so.sh build-apk.sh build-ksud.sh; do
            if [ -f "./$s" ]; then
              chmod +x "./$s"
              echo "Running ./$s"
              ./$s || true
            fi
          done

          # Cargo / Rust-produced libraries or binaries
          if [ -f Cargo.toml ]; then
            echo "Building cargo release"
            cargo build --release || true
            find target -type f \( -name "*.so" -o -name "ksud*" \) -print0 \
              | xargs -0 -r -I{} cp --parents "{}" "${{ env.OUT_DIR }}/"
            # also collect built binaries in target/release
            find target/release -maxdepth 1 -type f -executable -print0 \
              | xargs -0 -r -I{} cp --parents "{}" "${{ env.OUT_DIR }}/"
          fi

          # Generic Makefile targets that may create artifacts
          if [ -f Makefile ]; then
            if make -n so >/dev/null 2>&1; then
              make so || true
            fi
            if make -n apk >/dev/null 2>&1; then
              make apk || true
            fi
            # collect common patterns created by make
            find . -type f \( -name "*.so" -o -name "*.apk" -o -name "ksud*" \) -print0 \
              | xargs -0 -r -I{} cp --parents "{}" "${{ env.OUT_DIR }}/"
          fi

          # Finally, print what we collected
          echo "=== Contents of ${{ env.OUT_DIR }} (top-level) ==="
          ls -la "${{ env.OUT_DIR }}" || true
          echo "=== Recursive listing ==="
          find "${{ env.OUT_DIR }}" -print || true

      - name: Debug: show possible artifacts in repo (optional)
        shell: bash
        run: |
          set -euo pipefail
          echo "Files that match expected artifact patterns in the repo:"
          find . -type f \( -name "*.so" -o -name "*.apk" -o -name "ksud*" -o -name "*.zip" -o -name "*.tar.gz" \) -print || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: ${{ env.OUT_DIR }}/**
          if-no-files-found: warn        shell: bash
        run: |
          set -e
          OUT_DIR="${OUT_DIR:-$GITHUB_WORKSPACE/out}"
          mkdir -p "$OUT_DIR"

          echo "Building .so and ksud (if repository provides scripts or Makefile targets)..."

          # Repository-provided scripts (preferred)
          if [ -f ./build-so.sh ]; then
            chmod +x ./build-so.sh
            ./build-so.sh || echo "build-so.sh failed"
          fi
          if [ -f ./build-ksud.sh ]; then
            chmod +x ./build-ksud.sh
            ./build-ksud.sh || echo "build-ksud.sh failed"
          fi

          # Generic Makefile targets
          if [ -f Makefile ]; then
            if make -n so >/dev/null 2>&1; then
              make so || echo "make so failed"
            fi
            if make -n shared >/dev/null 2>&1; then
              make shared || echo "make shared failed"
            fi
            if make -n ksud >/dev/null 2>&1; then
              make ksud || echo "make ksud failed"
            fi
          fi

          # Collect produced .so files (robust copying)
          find . -type f -name "*.so" -print0 | xargs -0 -r -I{} cp -v --parents "{}" "$OUT_DIR"/ || true
          if [ "$(find "$OUT_DIR" -type f -name "*.so" | wc -l)" -gt 0 ]; then
            echo "Copied .so files"
          else
            echo "No .so files found"
          fi

          # Collect produced ksud binaries (common names)
          find . -type f \( -name ksud -o -name "ksud*" \) -executable -print0 | xargs -0 -r -I{} cp -v --parents "{}" "$OUT_DIR"/ || true
          if [ "$(find "$OUT_DIR" -type f -name "ksud*" | wc -l)" -gt 0 ]; then
            echo "Copied ksud binaries"
          else
            echo "No ksud binaries found"
          fi

      - name: Build kernel module (.ko)
        shell: bash
        run: |
          set -e
          OUT_DIR="${OUT_DIR:-$GITHUB_WORKSPACE/out}"
          mkdir -p "$OUT_DIR"

          echo "Attempting to build kernel modules (.ko)..."

          # Out-of-tree build using provided kernel headers/source
          if [ -n "$KERNEL_DIR" ] && [ -d "$KERNEL_DIR" ]; then
            echo "KERNEL_DIR provided: $KERNEL_DIR"
            make -C "$KERNEL_DIR" M=$PWD ARCH=${KERNEL_ARCH:-} CROSS_COMPILE=${CROSS_COMPILE:-} modules || echo "Kernel module build failed"
          fi

          # Repository-provided helper
          if [ -f ./build-ko.sh ]; then
            chmod +x ./build-ko.sh
            ./build-ko.sh || echo "build-ko.sh failed"
          fi

          # Try Makefile module targets in repo
          if [ -f Makefile ]; then
            if make -n ko >/dev/null 2>&1; then
              make ko || echo "make ko failed"
            fi
            if make -n modules >/dev/null 2>&1; then
              make modules || echo "make modules failed"
            fi
          fi

          # Collect .ko files (robust copying)
          find . -name "*.ko" -print0 | xargs -0 -r -I{} cp -v --parents "{}" "$OUT_DIR"/ || true
          if [ "$(find "$OUT_DIR" -type f -name "*.ko" | wc -l)" -gt 0 ]; then
            echo "Copied .ko files"
          else
            echo "No .ko files found"
          fi

      - name: Build APK
        shell: bash
        run: |
          set -e
          OUT_DIR="${OUT_DIR:-$GITHUB_WORKSPACE/out}"
          mkdir -p "$OUT_DIR"

          echo "Building APK (Gradle or repo-provided script)..."

          # Prefer repository-provided gradlew wrapper
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleRelease assembleDebug || echo "Gradle build failed"
          elif command -v gradle >/dev/null 2>&1; then
            gradle assembleRelease assembleDebug || echo "Gradle build failed"
          fi

          # Repository-provided helper
          if [ -f ./build-apk.sh ]; then
            chmod +x ./build-apk.sh
            ./build-apk.sh || echo "build-apk.sh failed"
          fi

          # Generic Makefile target 'apk'
          if [ -f Makefile ]; then
            if make -n apk >/dev/null 2>&1; then
              make apk || echo "make apk failed"
            fi
          fi

          # Collect produced APKs (robust copying)
          find . -name "*.apk" -print0 | xargs -0 -r -I{} cp -v --parents "{}" "$OUT_DIR"/ || true
          if [ "$(find "$OUT_DIR" -type f -name "*.apk" | wc -l)" -gt 0 ]; then
            echo "Copied APK files"
          else
            echo "No APK files found"
          fi

      - name: Show collected artifacts
        run: |
          echo "Collected artifacts in $OUT_DIR:"
          if [ -d "$OUT_DIR" ]; then
            ls -R "$OUT_DIR" || echo "Output directory is empty"
          else
            echo "Output directory does not exist!"
          fi

      - name: Create fallback artifacts summary
        if: always()
        run: |
          mkdir -p $GITHUB_WORKSPACE/out
          echo "Build completed. Check logs for details." > $GITHUB_WORKSPACE/out/build-summary.txt

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: out/
          if-no-files-found: warn
